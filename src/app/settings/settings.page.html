<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Configurações</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="settings-content">
  <ion-list>
    <ion-item>
      <ion-label>Vista horizontal</ion-label>
      <ion-toggle
        slot="end"
        [checked]="isHorizontal()"
        (ionChange)="onToggleChanged($event)"
      ></ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
